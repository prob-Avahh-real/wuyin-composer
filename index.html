<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#1a1410" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>五音堂</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #1a1410;
      --bg2: #241c16;
      --ink: #e8dcc8;
      --ink-dim: #a89880;
      --lacquer: #8b1e1e;
      --bronze: #c9a227;
      --accent: #c9a227;
      --line: rgba(232, 220, 200, 0.14);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --font-display: "ZCOOL XiaoWei", "Noto Serif SC", serif;
      --font-body: "Noto Serif SC", "Songti SC", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(120% 80% at 10% -10%, rgba(139, 30, 30, 0.28), transparent 55%),
        radial-gradient(90% 60% at 100% 0%, rgba(201, 162, 39, 0.12), transparent 50%),
        linear-gradient(180deg, #1f1712 0%, #1a1410 40%, #120e0b 100%);
    }

    .app {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      max-width: 720px;
      margin: 0 auto;
      padding-top: var(--safe-t);
    }

    header.brand {
      padding: 1.1rem 1.25rem 0.6rem;
      position: relative;
    }
    header.brand::after {
      content: "";
      position: absolute;
      left: 1.25rem; right: 1.25rem; bottom: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--bronze), transparent);
      opacity: 0.45;
    }
    .brand-mark {
      font-family: var(--font-display);
      font-size: clamp(2rem, 8vw, 2.6rem);
      letter-spacing: 0.28em;
      line-height: 1.1;
      color: var(--ink);
      text-indent: 0.28em;
      animation: brandIn 0.9s ease both;
    }
    .brand-sub {
      margin-top: 0.35rem;
      font-size: 0.82rem;
      color: var(--ink-dim);
      letter-spacing: 0.12em;
      animation: fadeUp 1s 0.15s ease both;
    }

    @keyframes brandIn {
      from { opacity: 0; letter-spacing: 0.5em; filter: blur(4px); }
      to { opacity: 1; letter-spacing: 0.28em; filter: blur(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    main {
      overflow: auto;
      padding: 0.9rem 1.1rem 1rem;
      -webkit-overflow-scrolling: touch;
    }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeUp 0.35s ease both; }

    .mode-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.45rem;
      margin-bottom: 0.9rem;
    }
    .mode-card {
      appearance: none;
      border: 1px solid var(--line);
      background: linear-gradient(165deg, rgba(255,255,255,0.04), transparent);
      color: var(--ink);
      border-radius: 2px;
      padding: 0.65rem 0.2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s, background 0.2s;
    }
    .mode-card .mode-name {
      display: block;
      font-family: var(--font-display);
      font-size: 1.35rem;
      color: var(--mode, var(--bronze));
    }
    .mode-card .mode-mood,
    .mode-card .mode-season {
      display: block;
      font-size: 0.58rem;
      color: var(--ink-dim);
      margin-top: 0.15rem;
      line-height: 1.2;
    }
    .mode-card.active {
      border-color: var(--mode, var(--accent));
      background: color-mix(in srgb, var(--mode, var(--accent)) 18%, transparent);
      transform: translateY(-1px);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--mode, var(--accent)) 35%, transparent);
    }

    #mode-detail {
      margin-bottom: 1rem;
      padding: 0.75rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    #mode-detail h2 {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--accent);
    }
    #mode-detail .lead { font-size: 0.92rem; line-height: 1.65; color: var(--ink); }
    #mode-detail .tip { margin-top: 0.4rem; font-size: 0.8rem; color: var(--ink-dim); }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem 0.7rem;
      margin-bottom: 1rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.25rem; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: 0.72rem; color: var(--ink-dim); letter-spacing: 0.08em; }
    input, select {
      appearance: none;
      background: var(--bg2);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 0.55rem 0.65rem;
      border-radius: 2px;
      font: inherit;
      font-size: 0.95rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .btn {
      appearance: none;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.12em;
      padding: 0.7rem 1rem;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn.primary {
      background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 55%, #3a2a10), color-mix(in srgb, var(--lacquer) 70%, #2a1010));
      border-color: color-mix(in srgb, var(--accent) 50%, transparent);
      color: #fff8e8;
      flex: 1;
    }
    .btn.ghost:hover, .btn:hover {
      border-color: var(--accent);
    }
    .btn.playing {
      border-color: var(--accent);
      color: var(--accent);
    }

    .viz-wrap {
      margin-top: 0.75rem;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.25);
      height: 88px;
      position: relative;
      overflow: hidden;
    }
    #note-viz { width: 100%; height: 100%; display: block; }

    #now-playing {
      margin-top: 0.65rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-height: 2.6rem;
    }
    #now-playing strong {
      font-family: var(--font-display);
      font-size: 1.15rem;
      letter-spacing: 0.08em;
    }
    #now-playing span, .muted, .empty, #batch-meta {
      color: var(--ink-dim);
      font-size: 0.8rem;
    }

    #song-list { display: flex; flex-direction: column; gap: 0.35rem; margin-top: 0.75rem; }
    .song-row {
      appearance: none;
      text-align: left;
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.02);
      color: var(--ink);
      padding: 0.65rem 0.75rem;
      border-radius: 2px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .song-row.on {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
    }
    .song-title { font-family: var(--font-display); letter-spacing: 0.06em; }
    .song-meta { font-size: 0.72rem; color: var(--ink-dim); }

    .theory-card {
      padding: 0.85rem 0;
      border-bottom: 1px solid var(--line);
    }
    .theory-card h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      margin-bottom: 0.35rem;
      color: var(--bronze);
      font-weight: 500;
    }
    .theory-card p { font-size: 0.88rem; line-height: 1.7; color: var(--ink); }

    #theory-modes {
      display: grid;
      gap: 0.55rem;
      margin-top: 1rem;
    }
    .theory-mode {
      padding: 0.7rem 0.75rem;
      border-left: 3px solid var(--mode, var(--bronze));
      background: rgba(255,255,255,0.02);
    }
    .theory-mode strong {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin-right: 0.4rem;
      color: var(--mode);
    }
    .theory-mode span { font-size: 0.75rem; color: var(--ink-dim); }
    .theory-mode p { margin-top: 0.35rem; font-size: 0.82rem; line-height: 1.55; color: var(--ink); }

    .wear-hint {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--ink-dim);
      line-height: 1.5;
    }

    nav.tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0;
      border-top: 1px solid var(--line);
      background: rgba(18, 14, 11, 0.92);
      padding-bottom: var(--safe-b);
      backdrop-filter: blur(8px);
    }
    nav.tabs button {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-dim);
      font-family: var(--font-display);
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      padding: 0.85rem 0.2rem;
      cursor: pointer;
    }
    nav.tabs button.active {
      color: var(--accent);
      box-shadow: inset 0 2px 0 var(--accent);
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(4.5rem + var(--safe-b));
      transform: translateX(-50%) translateY(12px);
      background: #2a2118;
      color: var(--ink);
      border: 1px solid var(--bronze);
      padding: 0.55rem 0.9rem;
      font-size: 0.85rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 20;
      max-width: 90%;
    }
    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Watch / tiny displays */
    @media (max-width: 280px), (max-height: 300px) {
      header.brand { padding: 0.35rem 0.45rem 0.25rem; }
      .brand-mark { font-size: 1.05rem; letter-spacing: 0.16em; text-indent: 0.16em; }
      .brand-sub { display: none; }
      main { padding: 0.35rem 0.4rem; }
      .mode-grid { gap: 0.2rem; margin-bottom: 0.35rem; }
      .mode-card { padding: 0.3rem 0.1rem; }
      .mode-card .mode-name { font-size: 0.95rem; }
      .mode-card .mode-mood, .mode-card .mode-season, #mode-detail .tip, .wear-hint,
      #theory-modes, .controls .field:nth-child(n+3) { display: none; }
      #mode-detail { padding: 0.35rem 0; margin-bottom: 0.4rem; }
      #mode-detail h2 { font-size: 0.95rem; margin-bottom: 0.15rem; }
      #mode-detail .lead { font-size: 0.68rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .controls { grid-template-columns: 1fr 1fr; gap: 0.25rem; margin-bottom: 0.35rem; }
      label { font-size: 0.55rem; }
      input, select { padding: 0.3rem 0.35rem; font-size: 0.75rem; }
      .btn { padding: 0.4rem 0.45rem; font-size: 0.78rem; letter-spacing: 0.06em; }
      .viz-wrap { height: 48px; margin-top: 0.35rem; }
      #now-playing strong { font-size: 0.85rem; }
      #now-playing span { font-size: 0.62rem; }
      .song-row { padding: 0.35rem 0.4rem; }
      .song-title { font-size: 0.8rem; }
      .song-meta { font-size: 0.58rem; }
      nav.tabs button { font-size: 0.7rem; letter-spacing: 0.06em; padding: 0.45rem 0; }
      #toast { bottom: calc(2.8rem + var(--safe-b)); font-size: 0.7rem; padding: 0.35rem 0.55rem; }
      .panel[data-panel="theory"] .theory-card:nth-child(n+2) { display: none; }
      .theory-card h3 { font-size: 0.85rem; }
      .theory-card p { font-size: 0.68rem; line-height: 1.4; }
    }

    @media (min-width: 640px) {
      .mode-grid { gap: 0.6rem; }
      .mode-card .mode-mood { font-size: 0.68rem; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="brand">
      <div class="brand-mark">五音堂</div>
      <p class="brand-sub">宫商角徵羽 · 批量主旋律创作</p>
    </header>

    <main>
      <section class="panel active" data-panel="compose">
        <div class="mode-grid" id="mode-grid"></div>
        <div id="mode-detail"></div>
        <div class="controls">
          <div class="field">
            <label for="count-input">批量首数</label>
            <input id="count-input" type="number" min="1" max="50" value="5" />
          </div>
          <div class="field">
            <label for="key-select">宫音</label>
            <select id="key-select">
              <option value="C">C</option>
              <option value="D" selected>D</option>
              <option value="E">E</option>
              <option value="F">F</option>
              <option value="G">G</option>
              <option value="A">A</option>
              <option value="Bb">B♭</option>
            </select>
          </div>
          <div class="field">
            <label for="structure-select">曲式</label>
            <select id="structure-select">
              <option value="short">短章</option>
              <option value="standard" selected>标准</option>
              <option value="ballad">慢歌</option>
            </select>
          </div>
          <div class="field">
            <label for="tempo-input">速度（可空）</label>
            <input id="tempo-input" type="number" min="60" max="128" placeholder="自动" />
          </div>
          <div class="field full">
            <label for="seed-input">种子（可空，可复现）</label>
            <input id="seed-input" type="number" placeholder="随机" />
          </div>
        </div>
        <div class="actions">
          <button type="button" class="btn primary" id="btn-compose">批量创作</button>
          <button type="button" class="btn ghost" id="btn-wearable">启用穿戴</button>
        </div>
        <p class="wear-hint">戒指：左右倾切换调式，摇一摇创作/播放；手杖：轻点播放，挥动切歌/调式。手表界面自动精简。</p>
      </section>

      <section class="panel" data-panel="library">
        <div id="batch-meta"></div>
        <div id="now-playing"></div>
        <div class="viz-wrap"><canvas id="note-viz"></canvas></div>
        <div class="actions" style="margin-top:0.75rem">
          <button type="button" class="btn" id="btn-prev">上一首</button>
          <button type="button" class="btn primary" id="btn-play">播放</button>
          <button type="button" class="btn" id="btn-next">下一首</button>
        </div>
        <div class="actions">
          <button type="button" class="btn ghost" id="btn-export-midi">MIDI</button>
          <button type="button" class="btn ghost" id="btn-export-json">JSON</button>
          <button type="button" class="btn ghost" id="btn-export-batch">批次导出</button>
        </div>
        <div id="song-list"></div>
      </section>

      <section class="panel" data-panel="theory">
        <div id="theory-list"></div>
        <div id="theory-modes"></div>
      </section>

      <section class="panel" data-panel="about">
        <article class="theory-card">
          <h3>产品</h3>
          <p>五音堂按中国传统五声调式（宫商角徵羽）选定调头，批量生成主旋律清晰的曲目，可试听并导出 MIDI / JSON。支持手机、手表精简 UI、智能戒指与手杖手势。</p>
        </article>
        <article class="theory-card">
          <h3>平台</h3>
          <p>PWA 可安装网页 · Capacitor Android / iOS · 手表媒体查询 · CLI 批量落盘。桌面可用浏览器打开 www/。</p>
        </article>
        <article class="theory-card">
          <h3>手势速查</h3>
          <p>摇戒指 / 点手杖：创作或播放暂停。左右倾：切换五音。上下倾 / 挥杖：切歌。</p>
        </article>
      </section>
    </main>

    <nav class="tabs">
      <button type="button" data-tab="compose" class="active">创作</button>
      <button type="button" data-tab="library">曲库</button>
      <button type="button" data-tab="theory">乐理</button>
      <button type="button" data-tab="about">关于</button>
    </nav>
  </div>
  <div id="toast" role="status"></div>
  <script src="./js/app.js"></script>
</body>
</html>
